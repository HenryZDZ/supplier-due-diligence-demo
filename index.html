<head>

<style>

.page{width:100%;max-width:1720px;margin:0 auto;padding:28px 30px 46px}.page-head,.case-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.head-actions,.actions{display:flex;align-items:center;gap:9px}.btn{min-height:36px;padding:8px 13px;border:1px solid #c8d0dc;border-radius:8px;background:#fff;color:var(--text);font-weight:580;cursor:pointer}.btn:hover{background:#f8fafc;border-color:#aab5c5}.btn:active{transform:translateY(1px)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1949bd}.btn.danger{color:var(--red);border-color:#e8b9bf}.btn.small{min-height:32px;padding:6px 10px;font-size:12px}.btn:disabled,.btn.primary:disabled{opacity:1;border-color:#d3dae6;background:#e1e6ef;color:#6f7c90;cursor:not-allowed;transform:none}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px}.empty{min-height:420px;display:grid;place-items:center;text-align:center}.empty-inner{max-width:440px}.empty h1{margin-bottom:10px}.empty p{margin:0 0 22px;color:var(--muted)}.task-table{width:100%;border-collapse:collapse}.task-table th{padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;text-align:left}.task-table td{padding:15px 14px;border-bottom:1px solid var(--line)}.task-row{cursor:pointer}.task-row:hover{background:#f8faff}.name{font-weight:650}.micro{margin-top:3px;color:var(--quiet);font-size:12px}

.back{border:0;background:transparent;color:var(--muted);padding:0 0 8px;cursor:pointer}.stepper{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.step{padding:13px 15px;border-right:1px solid var(--line);color:var(--quiet)}.step:last-child{border-right:0}.step.active{background:#f4f7ff;color:var(--blue);font-weight:650}.step.done{color:var(--green)}
.case-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.section-head h2,.section-head h3{margin:0}.content{padding:16px}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.data{padding:11px 12px;background:var(--surface2);border-radius:8px}.data span{display:block;color:var(--muted);font-size:12px}.data strong{display:block;margin-top:4px;font-weight:620}.project-list{display:grid;gap:9px}.project{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:9px}.project-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:620}.project-meta{margin-top:4px;color:var(--muted);font-size:12px}.project-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px}

.input,.textarea,.select{width:100%;min-height:38px;padding:9px 10px;border:1px solid #c8d0dc;border-radius:8px;background:#fff;color:var(--text)}.textarea{min-height:92px;resize:vertical}.field{margin-bottom:15px}.field label{display:block;margin-bottom:6px;font-weight:620}.required:after{content:" *";color:var(--red)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.wizard-progress{display:grid;grid-template-columns:1fr 1fr;margin-bottom:18px}.wizard-step{padding:9px 0;border-bottom:2px solid var(--line);color:var(--quiet);font-weight:620}.wizard-step.active{border-color:var(--blue);color:var(--blue)}.ai-plan{padding:12px 14px;margin-bottom:13px;border:1px solid #d7e2ff;border-radius:9px;background:#f5f8ff;color:#294b89}.picker{display:grid;gap:9px}.pick-row{display:grid;grid-template-columns:26px minmax(170px,1fr) 112px minmax(210px,1.2fr);gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:9px}.pick-row:has(input:checked){border-color:#b4c5ed;background:#f8faff}.add-project{display:grid;grid-template-columns:1fr 150px auto;gap:9px;margin-top:14px}
.project.material-missing{border-color:#dfb65e;background:#fffaf0;box-shadow:inset 3px 0 0 #d18a16}.project.material-missing .project-title{color:#754607}.blocked-action{border-color:#efdba9;background:var(--amber2)}.blocked-action .btn{width:100%;margin-top:14px}.supplement-mode-label{display:block;margin-bottom:7px;font-weight:620}.supplement-mode{display:grid;grid-template-columns:1fr 1fr;padding:4px;margin-bottom:14px;border:1px solid var(--line);border-radius:9px;background:var(--surface2)}.supplement-mode button{min-height:36px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:620;cursor:pointer}.supplement-mode button.active{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(24,42,72,.12)}.supplement-panel{padding:16px;margin-top:14px;border:1px solid var(--line);border-radius:9px;background:#fff}.supplement-panel[hidden]{display:none}.supplement-panel h3{margin-bottom:4px;font-size:15px}.supplement-panel>.micro{margin-bottom:15px}.supplement-panel .field:last-of-type{margin-bottom:14px}.supplement-panel>.btn{width:100%}.prefilled-file{padding:10px 11px;margin-bottom:8px;border:1px solid #d5deed;border-radius:8px;background:var(--surface2)}.prefilled-file strong,.prefilled-file span{display:block}.prefilled-file span{margin-top:3px;color:var(--quiet);font-size:12px}.field-help{margin-top:6px;color:var(--quiet);font-size:12px}.notice-preview{padding:13px;border:1px solid var(--line);border-radius:9px;background:var(--surface2)}.notice-meta{display:grid;grid-template-columns:70px 1fr;gap:7px;margin-bottom:12px;color:var(--muted);font-size:12px}.notice-message{padding:12px;border:1px solid #d6dfef;border-radius:8px;background:#fff;white-space:pre-wrap}.material-record{padding:13px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px}.material-record:last-child{margin-bottom:0}.material-record-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.material-record .raw-box{margin-top:10px}.empty-material{padding:18px;border:1px dashed #d7b66f;border-radius:9px;background:#fffaf0;text-align:center}.empty-material p{margin:6px 0 13px;color:var(--muted)}
.modal-layer,.drawer-layer{position:fixed;z-index:60;inset:0;background:rgba(11,19,32,.48)}.modal-layer{display:grid;place-items:center;padding:28px}.modal{width:min(820px,calc(100vw - 56px));max-height:calc(100vh - 56px);display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.modal-head,.modal-foot{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0}.modal-foot{justify-content:flex-end;border-top:1px solid var(--line);border-bottom:0;gap:9px}.modal-body{padding:18px;overflow:auto}.close{width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:23px;cursor:pointer}
.drawer-layer{display:flex;justify-content:flex-end}.drawer{width:min(520px,100vw);height:100%;background:#fff;box-shadow:var(--shadow);overflow:auto}.drawer-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:17px 18px;border-bottom:1px solid var(--line);background:#fff}.drawer-head h2{margin-bottom:0}.drawer-body{padding:18px}.raw-box{padding:13px;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;color:#45536a;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.toast{position:fixed;z-index:80;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 14px;border-radius:8px;background:#172033;color:#fff;box-shadow:var(--shadow)}
.agent-launcher{position:fixed;z-index:40;right:24px;bottom:24px;width:58px;height:58px;display:grid;place-items:center;padding:0;border:1px solid #263552;border-radius:50%;background:var(--navy);color:#fff;font-size:27px;box-shadow:0 12px 30px rgba(17,26,43,.28);cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}.agent-launcher:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(17,26,43,.32)}.agent-panel{position:fixed;z-index:40;top:58px;right:0;bottom:0;width:400px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:#fff;box-shadow:-12px 0 32px rgba(24,42,72,.16)}.agent-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 16px;border-bottom:1px solid var(--line)}.agent-identity{display:flex;align-items:center;gap:10px}.agent-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--navy);font-size:18px}.agent-title{font-weight:680}.agent-subtitle{margin-top:2px;color:var(--quiet);font-size:12px}.agent-collapse{min-height:32px;padding:6px 10px;border:0;border-radius:7px;background:var(--surface2);color:var(--muted);cursor:pointer}.agent-messages{flex:1;overflow:auto;padding:16px;background:#f7f9fc}.agent-message{max-width:92%;padding:11px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.agent-message.user{margin-left:auto;border-color:#cad8f7;background:#eef3ff}.agent-message-label{margin-bottom:6px;color:var(--quiet);font-size:11px;font-weight:650}.agent-message-body{white-space:pre-wrap}.agent-section-title{margin:12px 0 4px;font-weight:700;color:var(--text)}.agent-section-title:first-child{margin-top:0}.agent-composer{padding:13px;border-top:1px solid var(--line);background:#fff}.agent-input{width:100%;min-height:86px;padding:10px 11px;border:1px solid #c8d0dc;border-radius:9px;resize:vertical;color:var(--text)}.agent-composer-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}.agent-hint{color:var(--quiet);font-size:12px}.agent-send{min-width:72px}
@media(max-width:1050px){.case-grid,.approval-layout{grid-template-columns:1fr}.project,.source-row{grid-template-columns:minmax(0,1fr) auto}.project-actions{grid-column:1/-1;justify-content:flex-start}.page{padding:22px 20px 40px}}@media(max-width:720px){.topbar{padding:0 12px}.role-label{display:none}.role-switch button{padding:7px 9px}.page{padding:18px 14px 34px}.form-grid,.summary-grid{grid-template-columns:1fr}.step{padding:11px 8px;font-size:12px}.pick-row{grid-template-columns:26px 1fr}.pick-row>.badge,.pick-row>.micro{grid-column:2}.task-table{display:block;overflow:auto}.agent-panel{width:100%}.modal-layer{padding:12px}.modal{width:calc(100vw - 24px);max-height:calc(100vh - 24px)}}

<body>
<header class="topbar"><div class="brand"><span class="brand-mark">Z</span><span>甄商 · 供应商调查</span></div><div class="top-actions"><div class="role-control"><span class="role-label">工作台</span><div class="role-switch"><button id="role-investigator" onclick="setRole('investigator')">调查执行</button><button id="role-approver" onclick="setRole('approver')">审批</button></div></div></div></header>
<main id="app"></main><div id="agent-root"></div><div id="modal-root"></div><div id="drawer-root"></div><div id="toast-root"></div>
<script>
var STORAGE_KEY='supplier-due-diligence-workbench-v4';
var categoryMap={supplier:{label:'供应商材料',cls:'supplier'},public:{label:'权威公开源',cls:'public'},web:{label:'开放网络',cls:'web'}};
var state=loadState(),wizard=null,toastTimer=null,activeSupplementProjectId=null,agentOpen=false,agentSessions={},agentDrafts={},pendingAgentActions={};
function loadState(){try{var d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d&&Object.prototype.hasOwnProperty.call(d,'task')){d.tasks=Array.isArray(d.tasks)?d.tasks:(d.task?[d.task]:[]);d.tasks.forEach(normaliseTask);d.selectedTaskId=d.selectedTaskId||(d.task&&d.task.id)||null;d.task=d.tasks.find(function(t){return t.id===d.selectedTaskId})||d.tasks[0]||null;return d}}catch(e){}return{role:'investigator',view:'home',task:null,tasks:[],selectedTaskId:null}}
function normaliseTask(t){t.projects=(t.projects||[]).map(function(p){if(!Array.isArray(p.materials)){p.materials=p.category==='supplier'?(p.status==='materialReady'?(p.sources||[]).map(sourceToMaterial):[]):defaultPreparationMaterials(p)}if((t.stage==='missing'||t.stage==='ready')&&p.status==='pending')p.status=p.category==='supplier'?'materialMissing':'sourceReady';return p});if(t.stage==='missing'||t.stage==='ready')refreshPreparationStage(t)}
function sourceToMaterial(s){return{name:s.name||'已接收材料',type:'已归档材料',meta:s.meta||'已记录',raw:s.raw||''}}
function defaultPreparationMaterials(p){if(p.category==='supplier')return[];if(p.id==='entity')return[{name:'企业登记信息查询配置',type:'权威公开源',meta:'国家企业信用信息公示系统',raw:'查询字段：企业名称、统一社会信用代码\n预期结果：登记状态、法定代表人、股东与变更记录'}];if(p.id==='screening')return[{name:'司法与失信查询配置',type:'权威公开源',meta:'公开司法查询渠道',raw:'查询对象：供应商关键人员\n匹配字段：姓名、地区、公开身份信息'}];if(p.category==='web')return[{name:'开放网络检索方案',type:'开放网络',meta:'公开新闻与网络信息',raw:'检索范围：近 3 年公开信息\n关键词：处罚、事故、投诉、业务风险'}];return[{name:p.name+'查询配置',type:'权威公开源',meta:'查询源已配置',raw:'调查目标：'+p.reason+'\n状态：查询源已配置'}]}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
function showToast(m){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML='<div class="toast">'+esc(m)+'</div>';toastTimer=setTimeout(function(){document.getElementById('toast-root').innerHTML=''},2400)}
function nowText(){var d=new Date(),pad=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function actorLabel(role){return role==='approver'?'审批人':'调查执行人'}
function addActivity(text,actor){var time=nowText(),name=actor==='林妍'?'调查执行人':actor==='周明'?'审批人':actor||actorLabel(state.role);state.task.activity.unshift({text:text,meta:name+' · '+time});state.task.updated=time}
function categoryBadge(k){var x=categoryMap[k]||categoryMap.public;return'<span class="badge '+x.cls+'">'+x.label+'</span>'}
function taskStatus(task){var s=(task||state.task)&& (task||state.task).stage;if(s==='missing'||s==='ready')return{label:'准备材料',cls:'amber'};if(s==='running')return{label:'调查中',cls:'blue'};if(s==='review'||s==='approvalReady')return{label:'待复核',cls:'amber'};if(s==='pendingApproval')return{label:'待审批',cls:'blue'};return{label:'已完成',cls:'green'}}
function projectResultView(p){var map={materialMissing:{tone:'amber',label:'待补充材料'},sourceReady:{tone:'blue',label:'查询源已配置'},running:{tone:'blue',label:'调查中'},suspectedRisk:{tone:'amber',label:'待核验'},risk:{tone:'red',label:'已确认风险'},noRisk:{tone:'green',label:'未发现风险'},unknown:{tone:'amber',label:'信息不足'},pending:{tone:'gray',label:'待调查'}};if(p.status==='materialReady')return{tone:'green',label:'已接收 '+((p.materials&&p.materials.length)||1)+' 项'};return map[p.status]||map.pending}
function needsAttention(p){return p.status==='suspectedRisk'||p.status==='risk'||p.status==='unknown'}
function setRole(r){state.role=r;save();render();showToast(r==='approver'?'已进入审批工作台':'已进入调查工作台')}
function render(){document.getElementById('role-investigator').classList.toggle('active',state.role==='investigator');document.getElementById('role-approver').classList.toggle('active',state.role==='approver');if(!state.task||state.view==='home')renderHome();else if(state.task.stage==='pendingApproval'&&state.role==='approver')renderApproval();else if(state.task.stage==='completed')renderArchive();else renderCase();renderAgentPanel()}
function renderHome(){if(!state.tasks.length){document.getElementById('app').innerHTML='<section class="page"><div class="panel empty"><div class="empty-inner"><h1>供应商调查</h1><p>创建调查任务，确认调查范围并跟踪处理进度。</p><button id="create-task" class="btn primary" onclick="openCreate()">新建调查任务</button></div></div></section>';return}document.getElementById('app').innerHTML='<section class="page"><div class="page-head"><h1>调查任务</h1><div class="head-actions"><button id="create-task" class="btn primary" onclick="openCreate()">新建调查任务</button></div></div><div class="panel"><table class="task-table"><thead><tr><th>供应商 / 任务编号</th><th>当前状态</th><th>调查项目</th><th>当前责任人</th><th>更新时间</th></tr></thead><tbody>'+state.tasks.map(function(t){var s=taskStatus(t);return'<tr class="task-row" onclick="openTask(\''+esc(t.id)+'\')"><td><div class="name">'+esc(t.name)+'</div><div class="micro">'+esc(t.id)+'</div></td><td><span class="badge '+s.cls+'">'+s.label+'</span></td><td>'+t.projects.length+' 项</td><td>'+(t.stage==='pendingApproval'?'审批人':'调查执行人')+'</td><td>'+esc(t.updated)+'</td></tr>'}).join('')+'</tbody></table></div></section>'}
function openTask(id){if(id){state.selectedTaskId=id;state.task=state.tasks.find(function(t){return t.id===id})||state.task}state.view='task';save();render()}function goHome(){state.view='home';save();render()}
function agentPreset(){return'请结合当前任务背景、调查目标和项目清单，识别可能遗漏的调查范围，并给出一项优先补充建议。'}

function agentScopeAnalysis(t){var hasDelivery=t.projects.some(function(p){return/履约|交付|产能|经营稳定/.test(p.name)});if(hasDelivery)return'分析结论\n当前项目已兼顾合规风险与履约能力，仍可能缺少对关联关系和利益冲突的系统核验。\n\n优先建议补充\n关联关系与利益冲突排查\n\n为什么优先\n1. 准入决策既要判断供应商是否合规，也要判断交易关系是否独立、公正。\n2. 关联股东、交叉任职和内部利益关系分散在多类信息中，需要跨项目整合判断。\n\n建议核验结构\n• 股权与实际控制关系\n• 关键人员交叉任职\n• 与采购经办人的利益关联';return'分析结论\n当前范围已覆盖主体登记、准入资质、关键人员风险和公开舆情，仍可能缺少对持续履约能力的判断。\n\n优先建议补充\n履约能力与经营稳定性核验\n\n为什么优先\n1. 供应商准入不仅需要排除合规风险，也需要判断持续供货能力。\n2. 现有项目主要回答“是否合规”，对“是否能稳定交付”覆盖较少。\n3. 该项可以综合产能、交付记录、重大合同纠纷、经营异常和核心人员变动等分散信号。\n\n建议核验结构\n• 经营稳定性：经营异常、重大变更、停产风险\n• 履约记录：延期、违约、重大纠纷\n• 交付能力：产能、关键设备、核心人员稳定性\n\n决策建议\n是否加入该项，可结合采购金额、替代难度和供应中断影响决定。'}

function openSupplement(id){activeSupplementProjectId=id;var p=state.task.projects.find(function(x){return x.id===id});if(!p)return;var defaultFile=p.name+'_有效材料.pdf',defaultNote='该材料由供应商联系人提供，用于核验'+p.name+'，请以文件中的签发日期和有效期为准。',phone='138 4726 9135',message=noticeMessage(p);openModal('补充材料 · '+p.name,'<span class="supplement-mode-label">补充方式</span><div class="supplement-mode" role="tablist" aria-label="选择补充方式"><button id="mode-manual" class="active" role="tab" aria-selected="true" aria-controls="supplement-manual" onclick="setSupplementMode(\'manual\')">手动上传</button><button id="mode-notice" role="tab" aria-selected="false" aria-controls="supplement-notice" onclick="setSupplementMode(\'notice\')">发送补充通知</button></div><div class="callout"><strong>待补充内容</strong><div class="micro" style="color:inherit">'+esc(p.reason)+'</div></div><section id="supplement-manual" class="supplement-panel" role="tabpanel" aria-labelledby="mode-manual"><h3>手动上传</h3><div class="micro">已关联当前项目，可补充附件、网页地址或备注。</div><div class="field"><label for="material-file">本地附件</label><div class="prefilled-file"><strong id="default-material-file">'+esc(defaultFile)+'</strong><span>已带入任务材料，可重新选择文件。</span></div><input id="material-file" class="input" type="file" onchange="updateMaterialFileName()"></div><div class="field"><label for="material-url">线上网页地址</label><input id="material-url" class="input" type="url" value="" placeholder="https://"></div><div class="field"><label for="material-note">备注信息（可选）</label><textarea id="material-note" class="textarea">'+esc(defaultNote)+'</textarea></div><button class="btn primary" onclick="completeManualSupplement()">保存材料</button></section><section id="supplement-notice" class="supplement-panel" role="tabpanel" aria-labelledby="mode-notice" hidden><h3>发送补充通知</h3><div class="micro">已带入供应商联系人手机号，可修改后发送。</div><div class="field"><label class="required" for="supplier-phone">对方手机号码</label><input id="supplier-phone" class="input" type="tel" inputmode="numeric" autocomplete="tel" value="'+esc(phone)+'" oninput="updateNoticePreview()"></div><div class="field"><label>短信预览</label><div class="notice-preview"><div class="notice-meta"><span>发送渠道</span><strong>手机短信</strong><span>接收号码</span><strong id="notice-phone-preview">'+esc(maskPhone(phone.replace(/\s/g,'')))+'</strong><span>关联项目</span><strong>'+esc(p.name)+'</strong></div><div id="notice-message-preview" class="notice-message">'+esc(message)+'</div></div><div class="field-help">发送后，对方可通过短信中的专属链接提交材料。</div></div><button class="btn primary" onclick="sendSupplementNotice()">发送通知</button></section>','<button class="btn" onclick="closeModal()">取消</button>')}
function setSupplementMode(mode){var manual=mode==='manual',manualPanel=document.getElementById('supplement-manual'),noticePanel=document.getElementById('supplement-notice'),manualButton=document.getElementById('mode-manual'),noticeButton=document.getElementById('mode-notice');manualPanel.hidden=!manual;noticePanel.hidden=manual;manualButton.classList.toggle('active',manual);noticeButton.classList.toggle('active',!manual);manualButton.setAttribute('aria-selected',manual?'true':'false');noticeButton.setAttribute('aria-selected',manual?'false':'true')}

function completeManualSupplement(){var p=state.task.projects.find(function(x){return x.id===activeSupplementProjectId}),fileInput=document.getElementById('material-file'),file=fileInput.files&&fileInput.files[0],fileName=file?file.name:document.getElementById('default-material-file').textContent,url=document.getElementById('material-url').value.trim(),note=document.getElementById('material-note').value.trim(),time=nowText();if(url&&!/^https?:\/\//i.test(url)){showToast('线上网页地址请以 http:// 或 https:// 开头');return}var materials=[{name:fileName,type:'本地附件',meta:(file?'调查执行人上传':'任务材料')+' · '+time,raw:'文件名：'+fileName+'\n所属项目：'+p.name+(note?'\n备注：'+note:'')}];if(url)materials.push({name:'线上网页材料',type:'网页地址',meta:url,raw:'网页地址：'+url+'\n所属项目：'+p.name+(note?'\n备注：'+note:'')});completeSupplement(p,materials,'上传并登记了“'+p.name+'”的材料','材料已保存')}

function startInvestigation(){var missing=missingMaterialProjects(state.task);if(missing.length){state.task.stage='missing';save();render();showToast('请先补齐所有空缺材料');return}state.task.stage='running';state.task.projects.forEach(function(p){p.status='running'});addActivity('开始执行调查项目','调查执行人');save();render();setTimeout(finishInvestigation,700)}
function projectSystemResult(p,time){p.reviewed=false;if(p.id==='screening'){p.status='suspectedRisk';p.systemStatus='suspectedRisk';p.conclusion='系统初判：发现 1 条同名疑似记录，需人工核验';p.sources=[{name:'公开司法与失信信息查询',meta:'查询时间：'+time+' · 查询条件：姓名、地区',raw:'查询对象：供应商关键人员 张伟\n返回结果：1 条同名疑似记录\n地区：广东深圳\n身份标识：公开信息不足\n系统初判：待核验，不能据此确认主体风险'}]}else if(p.category==='supplier'){p.status='noRisk';p.systemStatus='noRisk';p.conclusion='系统初判：材料关键信息与合作要求一致，未发现异常';if(!p.sources.length)p.sources=[{name:'供应商提交材料',meta:'接收时间：'+time+' · 当前版本',raw:'文件：'+p.name+'相关材料.pdf\n提交方：供应商联系人\n核验结果：关键信息一致'}]}else if(/安全生产/.test(p.name)){p.status='noRisk';p.systemStatus='noRisk';p.conclusion='系统初判：在本次查询范围内未发现明确的安全生产处罚记录';p.sources=[{name:'安全生产公开信息检索',meta:'查询时间：'+time+' · 覆盖近 3 年公开信息',raw:'查询对象：'+state.task.name+'\n检索范围：公开监管信息与行政处罚信息\n结果：未发现可确认的安全生产处罚记录\n限制：公开信息可能存在更新延迟或遗漏'}]}else if(p.category==='web'){p.status='noRisk';p.systemStatus='noRisk';p.conclusion='系统初判：在本次检索范围内未发现明确负面信息';p.sources=[{name:'公开新闻与网络信息检索',meta:'查询时间：'+time+' · 覆盖近 3 年公开信息',raw:'检索词：'+state.task.name+' + 处罚 / 事故 / 投诉\n结果：未发现可确认且与本次合作直接相关的重大负面信息\n限制：开放网络信息可能不完整'}]}else{p.status='noRisk';p.systemStatus='noRisk';p.conclusion='系统初判：登记状态正常，未发现异常登记信息';p.sources=[{name:'企业登记公开信息查询',meta:'查询时间：'+time+' · 登记信息快照',raw:'企业名称：'+state.task.name+'\n登记状态：存续\n经营异常：未发现\n查询时间：'+time}]}p.systemConclusion=p.conclusion}

var activeReviewProjectId=null;

function reviewReason(result,p){if(result==='risk')return'复核原始记录与主体信息后，确认该项目存在需要纳入审批判断的风险。';if(result==='unknown')return'现有公开信息不足以确认或排除该项目风险，需要补充身份信息后再次核验。';return p&&p.id==='screening'?'补充身份信息显示出生年份与任职经历不一致，确认疑似记录并非同一主体。':'已复核原始依据，未发现需要纳入审批判断的明确风险。'}

function submitApproval(){var t=state.task,unreviewed=t.projects.filter(function(p){return !p.reviewed}).length,attention=t.projects.filter(needsAttention).length,rows=t.projects.map(function(p){var view=projectResultView(p);return'<div class="confirm-row"><div><strong>'+esc(p.name)+'</strong><div class="micro">'+(p.reviewed?'人工已复核':'沿用系统初判')+'</div></div><span class="badge '+view.tone+'">'+view.label+'</span></div>'}).join('');openModal('提交审批','<div class="callout"><strong>请核对每个调查项目的结论与依据。</strong><div class="micro" style="color:inherit;margin-top:5px">提交后由审批人作出最终准入决定。</div></div><div class="confirm-list">'+rows+'</div><div class="micro" style="margin-bottom:12px">共 '+t.projects.length+' 项：'+attention+' 项需关注，'+unreviewed+' 项沿用系统初判。</div><label class="confirm-check"><input id="submit-confirm-check" type="checkbox" onchange="toggleSubmitConfirm()"><span>我已核对上述结论与依据，确认提交审批。</span></label>','<button class="btn" onclick="closeModal()">返回检查</button><button id="confirm-submit-approval" class="btn primary" disabled onclick="confirmSubmitApproval()">提交审批</button>')}

function renderApproval(){var t=state.task,attentionCount=t.projects.filter(needsAttention).length,reviewedCount=t.projects.filter(function(p){return p.reviewed}).length;document.getElementById('app').innerHTML='<section class="page"><div class="case-head"><div><button class="back" onclick="goHome()">← 返回任务</button><h1>'+esc(t.name)+'</h1><div class="micro">'+esc(t.id)+' · 调查报告</div></div><span class="badge blue">待审批</span></div>'+stepper()+'<div class="approval-layout"><section class="panel"><div class="section-head"><h2>逐项调查结论</h2><span class="micro">人工复核 '+reviewedCount+' / '+t.projects.length+' 项</span></div><div class="content"><div class="callout '+(attentionCount?'risk':'success')+'">'+(attentionCount?'当前有 '+attentionCount+' 项需关注结果。审批人不能直接作出无条件通过决定。':'当前未发现明确风险，未人工复核的项目沿用系统初判。')+'</div><div style="margin-top:12px">'+t.projects.map(approvalProject).join('')+'</div></div></section><aside class="panel"><div class="section-head"><h3>审批决定</h3></div><div class="content">'+decisionOptions(attentionCount>0)+'<div class="field"><label id="approval-label">'+(attentionCount?'审批意见（必填）':'审批意见（选填）')+'</label><textarea id="approval-note" class="textarea" placeholder="说明准入条件、暂缓原因或拒绝依据"></textarea></div><button id="sign-approval" class="btn primary" style="width:100%" onclick="signApproval()">确认审批</button><button class="btn" style="width:100%;margin-top:8px" onclick="returnReview()">退回复核</button></div></aside></div></section>'}

function openEvidence(id){var p=state.task.projects.find(function(x){return x.id===id});if(!p)return;var rows=p.sources.map(function(s){return'<div class="source-row"><div><div class="name">'+esc(s.name)+'</div><div class="micro">'+esc(s.meta)+'</div></div>'+categoryBadge(p.category)+'</div><div class="raw-box">'+esc(s.raw)+'</div>'}).join('');openDrawer(p.name,'结论与依据','<div class="callout '+(needsAttention(p)?'risk':'success')+'">'+esc(p.conclusion||'尚未形成结论')+'</div><div style="margin-top:14px">'+(rows||'<div class="micro">尚无来源记录</div>')+'</div>')}
function openModal(t,b,f){document.getElementById('modal-root').innerHTML='<div class="modal-layer" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="'+esc(t)+'"><div class="modal-head"><h2>'+esc(t)+'</h2><button class="close" aria-label="关闭" onclick="closeModal()">×</button></div><div class="modal-body">'+b+'</div><div class="modal-foot">'+f+'</div></div></div>'}
function closeModal(){document.getElementById('modal-root').innerHTML=''}function openDrawer(t,s,b){document.getElementById('drawer-root').innerHTML='<div class="drawer-layer" onclick="if(event.target===this)closeDrawer()"><aside class="drawer" aria-label="'+esc(t)+'"><div class="drawer-head"><div><h2>'+esc(t)+'</h2><div class="micro">'+esc(s)+'</div></div><button class="close" aria-label="关闭" onclick="closeDrawer()">×</button></div><div class="drawer-body">'+b+'</div></aside></div>'}function closeDrawer(){document.getElementById('drawer-root').innerHTML=''}
render();
</script>
</body>
