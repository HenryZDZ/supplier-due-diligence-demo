<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>甄商 · 供应商调查工作台</title>
<style>
:root{--bg:#f3f5f8;--surface:#fff;--surface2:#f7f9fc;--line:#dce2ea;--text:#172033;--muted:#627086;--quiet:#8793a5;--navy:#111a2b;--blue:#2458d3;--blue2:#eaf0ff;--green:#147052;--green2:#eaf8f2;--amber:#9a5b08;--amber2:#fff6e5;--red:#b72e3b;--red2:#fff0f1;--shadow:0 18px 45px rgba(24,42,72,.16)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--text);font:14px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{white-space:nowrap}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(36,88,211,.2);outline-offset:1px}h1,h2,h3,p{margin-top:0}h1{font-size:24px;letter-spacing:-.02em}h2{font-size:18px}h3{font-size:14px}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--navy);color:#fff}.brand{display:flex;align-items:center;gap:10px;font-weight:650}.brand-mark{width:27px;height:27px;display:grid;place-items:center;border-radius:7px;background:#fff;color:var(--navy);font-size:12px;font-weight:800}.top-actions{display:flex;align-items:center;gap:12px}.role-control{display:flex;align-items:center;gap:10px;padding-right:12px;border-right:1px solid rgba(255,255,255,.22)}.role-label{color:#eef3fb;font-size:13px;font-weight:650}.role-switch{display:flex;gap:5px;padding:4px;border-radius:9px;background:rgba(255,255,255,.09)}.role-switch button{border:0;border-radius:6px;padding:7px 11px;color:#cbd5e4;background:transparent;cursor:pointer}.role-switch button.active{background:#fff;color:var(--text)}.demo-action{min-height:34px;padding:7px 11px;border:1px solid rgba(255,255,255,.24);border-radius:7px;background:transparent;color:#d8e0ec;cursor:pointer}.demo-action:hover{border-color:rgba(255,255,255,.45);background:rgba(255,255,255,.08);color:#fff}.demo-action:disabled{opacity:.38;cursor:not-allowed}
.page{min-width:980px;padding:28px 30px 46px}.page-head,.case-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}.head-actions,.actions{display:flex;align-items:center;gap:9px}.btn{min-height:36px;padding:8px 13px;border:1px solid #c8d0dc;border-radius:8px;background:#fff;color:var(--text);font-weight:580;cursor:pointer}.btn:hover{background:#f8fafc;border-color:#aab5c5}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1949bd}.btn.danger{color:var(--red);border-color:#e8b9bf}.btn.small{min-height:30px;padding:5px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px}.empty{min-height:540px;display:grid;place-items:center;text-align:center}.empty-inner{max-width:440px}.empty h1{margin-bottom:10px}.empty p{margin:0 0 22px;color:var(--muted)}.task-table{width:100%;border-collapse:collapse}.task-table th{padding:11px 14px;background:var(--surface2);border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;text-align:left}.task-table td{padding:15px 14px;border-bottom:1px solid var(--line)}.task-row{cursor:pointer}.task-row:hover{background:#f8faff}.name{font-weight:650}.micro{margin-top:3px;color:var(--quiet);font-size:12px}
.badge{display:inline-flex;align-items:center;min-height:23px;padding:3px 8px;border:1px solid transparent;border-radius:999px;font-size:11px;font-weight:650}.badge.blue{background:var(--blue2);border-color:#d5e0ff;color:#254fae}.badge.green{background:var(--green2);border-color:#c8e9dc;color:var(--green)}.badge.amber{background:var(--amber2);border-color:#efdba9;color:var(--amber)}.badge.red{background:var(--red2);border-color:#efc5cb;color:var(--red)}.badge.gray{background:#f0f3f7;border-color:#e1e6ed;color:#59677c}.badge.supplier{background:#f6efe8;color:#815638}.badge.public{background:#eaf0ff;color:#3157a2}.badge.web{background:#f2edfc;color:#684da0}
.back{border:0;background:transparent;color:var(--muted);padding:0 0 8px;cursor:pointer}.stepper{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.step{padding:13px 15px;border-right:1px solid var(--line);color:var(--quiet)}.step:last-child{border-right:0}.step.active{background:#f4f7ff;color:var(--blue);font-weight:650}.step.done{color:var(--green)}
.case-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.section-head h2,.section-head h3{margin:0}.content{padding:16px}.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.data{padding:11px 12px;background:var(--surface2);border-radius:8px}.data span{display:block;color:var(--muted);font-size:11px}.data strong{display:block;margin-top:4px;font-weight:620}.project-list{display:grid;gap:9px}.project{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:9px}.project-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:620}.project-meta{margin-top:4px;color:var(--muted);font-size:12px}.project-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px}
.callout{padding:13px 14px;border:1px solid #efdba9;border-radius:9px;background:var(--amber2);color:#6f4b14}.callout.success{border-color:#c6eadb;background:var(--green2);color:#155c45}.callout.risk{border-color:#efc5cb;background:var(--red2);color:#81242e}.task-card{padding:15px;border:1px solid var(--line);border-radius:9px;background:#fff}.task-card h3{margin-bottom:7px}.task-card p{margin:0;color:var(--muted)}.task-card .actions{margin-top:14px;flex-wrap:wrap}.activity-item{padding:11px 0;border-bottom:1px solid var(--line)}.activity-item:last-child{border-bottom:0}
.approval-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}.conclusion{padding:14px;border-radius:9px;background:var(--surface2);border:1px solid var(--line)}.source-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.source-row:last-child{border-bottom:0}.radio{display:flex;align-items:flex-start;gap:9px;padding:11px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}.radio:has(input:checked){border-color:#a9bde9;background:#f7f9ff}.confirm-list{margin:14px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden}.confirm-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}.confirm-row:last-child{border-bottom:0}.confirm-check{display:flex;align-items:flex-start;gap:9px;padding:12px;border:1px solid #c8d0dc;border-radius:9px;background:var(--surface2);font-weight:620;cursor:pointer}.confirm-check input{margin-top:3px}
.input,.textarea,.select{width:100%;min-height:38px;padding:9px 10px;border:1px solid #c8d0dc;border-radius:8px;background:#fff;color:var(--text)}.textarea{min-height:92px;resize:vertical}.field{margin-bottom:15px}.field label{display:block;margin-bottom:6px;font-weight:620}.required:after{content:" *";color:var(--red)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.wizard-progress{display:grid;grid-template-columns:1fr 1fr;margin-bottom:18px}.wizard-step{padding:9px 0;border-bottom:2px solid var(--line);color:var(--quiet);font-weight:620}.wizard-step.active{border-color:var(--blue);color:var(--blue)}.ai-plan{padding:12px 14px;margin-bottom:13px;border:1px solid #d7e2ff;border-radius:9px;background:#f5f8ff;color:#294b89}.picker{display:grid;gap:9px}.pick-row{display:grid;grid-template-columns:26px minmax(170px,1fr) 112px minmax(210px,1.2fr);gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:9px}.pick-row:has(input:checked){border-color:#b4c5ed;background:#f8faff}.add-project{display:grid;grid-template-columns:1fr 150px auto;gap:9px;margin-top:14px}
.modal-layer,.drawer-layer{position:fixed;z-index:50;inset:0;background:rgba(11,19,32,.48)}.modal-layer{display:grid;place-items:center;padding:28px}.modal{width:min(820px,calc(100vw - 56px));max-height:calc(100vh - 56px);display:flex;flex-direction:column;background:#fff;border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.modal-head,.modal-foot{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0}.modal-foot{justify-content:flex-end;border-top:1px solid var(--line);border-bottom:0;gap:9px}.modal-body{padding:18px;overflow:auto}.close{width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:23px;cursor:pointer}
.drawer-layer{display:flex;justify-content:flex-end}.drawer{width:min(520px,100vw);height:100%;background:#fff;box-shadow:var(--shadow);overflow:auto}.drawer-head{position:sticky;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:17px 18px;border-bottom:1px solid var(--line);background:#fff}.drawer-head h2{margin-bottom:0}.drawer-body{padding:18px}.raw-box{padding:13px;margin-top:12px;border:1px solid var(--line);border-radius:8px;background:#f8fafc;color:#45536a;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.toast{position:fixed;z-index:80;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 14px;border-radius:8px;background:#172033;color:#fff;box-shadow:var(--shadow)}
@media(max-width:1050px){.case-grid,.approval-layout{grid-template-columns:1fr}.page{min-width:760px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">Z</span><span>甄商 · 供应商调查</span></div><div class="top-actions"><div class="role-control"><span class="role-label">切换当前角色</span><div class="role-switch"><button id="role-investigator" onclick="setRole('investigator')">调查执行人</button><button id="role-approver" onclick="setRole('approver')">审批人</button></div></div><button id="restart-demo" class="demo-action" onclick="resetDemo()" title="清除当前进度并返回初始状态">重新开始演示</button></div></header>
<main id="app"></main><div id="modal-root"></div><div id="drawer-root"></div><div id="toast-root"></div>
<script>
var STORAGE_KEY='supplier-due-diligence-demo-v3';
var categoryMap={supplier:{label:'供应商材料',cls:'supplier'},public:{label:'权威公开源',cls:'public'},web:{label:'开放网络',cls:'web'}};
var state=loadState(),wizard=null,toastTimer=null;
function loadState(){try{var d=JSON.parse(localStorage.getItem(STORAGE_KEY));if(d&&Object.prototype.hasOwnProperty.call(d,'task')){d.tasks=Array.isArray(d.tasks)?d.tasks:(d.task?[d.task]:[]);d.selectedTaskId=d.selectedTaskId||(d.task&&d.task.id)||null;d.task=d.tasks.find(function(t){return t.id===d.selectedTaskId})||d.tasks[0]||null;return d}}catch(e){}return{role:'investigator',view:'home',task:null,tasks:[],selectedTaskId:null}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
function showToast(m){clearTimeout(toastTimer);document.getElementById('toast-root').innerHTML='<div class="toast">'+esc(m)+'</div>';toastTimer=setTimeout(function(){document.getElementById('toast-root').innerHTML=''},2400)}
function addActivity(text,actor){state.task.activity.unshift({text:text,meta:actor+' · 刚刚'});state.task.updated='刚刚'}
function categoryBadge(k){var x=categoryMap[k]||categoryMap.public;return'<span class="badge '+x.cls+'">'+x.label+'</span>'}
function taskStatus(task){var s=(task||state.task)&& (task||state.task).stage;if(s==='missing'||s==='ready')return{label:'资料准备',cls:'amber'};if(s==='running')return{label:'调查中',cls:'blue'};if(s==='review')return{label:'待复核',cls:'amber'};if(s==='approvalReady'||s==='pendingApproval')return{label:'待审批',cls:'blue'};return{label:'已完成',cls:'green'}}
function setRole(r){state.role=r;save();render();showToast(r==='approver'?'已切换为审批人':'已切换为调查执行人')}
function render(){document.getElementById('role-investigator').classList.toggle('active',state.role==='investigator');document.getElementById('role-approver').classList.toggle('active',state.role==='approver');document.getElementById('restart-demo').disabled=!state.tasks.length;if(!state.task||state.view==='home')renderHome();else if(state.task.stage==='pendingApproval'&&state.role==='approver')renderApproval();else if(state.task.stage==='completed')renderArchive();else renderCase()}
function renderHome(){if(!state.tasks.length){document.getElementById('app').innerHTML='<section class="page"><div class="panel empty"><div class="empty-inner"><h1>供应商调查</h1><p>填写调查背景和目标，生成本次调查项目清单。</p><button id="create-task" class="btn primary" onclick="openCreate()">新建调查任务</button></div></div></section>';return}document.getElementById('app').innerHTML='<section class="page"><div class="page-head"><h1>调查任务</h1><div class="head-actions"><button id="create-task" class="btn primary" onclick="openCreate()">新建调查任务</button></div></div><div class="panel"><table class="task-table"><thead><tr><th>供应商 / 任务编号</th><th>当前状态</th><th>调查项目</th><th>当前责任人</th><th>更新时间</th></tr></thead><tbody>'+state.tasks.map(function(t){var s=taskStatus(t);return'<tr class="task-row" onclick="openTask(\''+esc(t.id)+'\')"><td><div class="name">'+esc(t.name)+'</div><div class="micro">'+esc(t.id)+'</div></td><td><span class="badge '+s.cls+'">'+s.label+'</span></td><td>'+t.projects.length+' 项</td><td>'+(t.stage==='pendingApproval'?'周明 · 审批':'林妍 · 调查')+'</td><td>'+esc(t.updated)+'</td></tr>'}).join('')+'</tbody></table></div></section>'}
function openTask(id){if(id){state.selectedTaskId=id;state.task=state.tasks.find(function(t){return t.id===id})||state.task}state.view='task';save();render()}function goHome(){state.view='home';save();render()}
function resetDemo(){if(!state.tasks.length)return;if(!confirm('重新开始演示将清除全部任务进度并返回初始页面，是否继续？'))return;state={role:'investigator',view:'home',task:null,tasks:[],selectedTaskId:null};localStorage.removeItem(STORAGE_KEY);closeModal();closeDrawer();render();showToast('演示已重新开始')}

function openCreate(){wizard={step:1,form:{name:'启明精密制造（深圳）有限公司',region:'中国大陆 · 深圳',background:'计划采购核心零部件，拟将该企业纳入合格供应商名录，需要在准入前完成供应商调查。',goal:'核验企业主体、合作所需资质、关键人员司法风险及公开舆情，支持本次供应商准入判断。',expected:'安全生产记录'},projects:[]};renderWizard()}
function renderWizard(){if(wizard.step===1){openModal('新建供应商调查任务','<div class="wizard-progress"><div class="wizard-step active">1　填写调查场景</div><div class="wizard-step">2　确认调查项目</div></div><div class="form-grid"><div class="field"><label class="required">供应商名称</label><input id="w-name" class="input" value="'+esc(wizard.form.name)+'" placeholder="输入供应商全称"></div><div class="field"><label>所在地区</label><input id="w-region" class="input" value="'+esc(wizard.form.region)+'" placeholder="例如：中国大陆 · 深圳"></div></div><div class="field"><label class="required">业务背景</label><textarea id="w-background" class="textarea" placeholder="说明合作事项、业务范围和本次调查背景">'+esc(wizard.form.background)+'</textarea></div><div class="field"><label class="required">调查目标</label><textarea id="w-goal" class="textarea" placeholder="说明希望通过调查支持什么业务判断">'+esc(wizard.form.goal)+'</textarea></div><div class="field"><label>期望调查项目</label><textarea id="w-expected" class="textarea" placeholder="多个项目可用逗号或换行分隔">'+esc(wizard.form.expected)+'</textarea></div>','<button class="btn" onclick="closeModal()">取消</button><button id="ai-next" class="btn primary" onclick="generatePlan()">AI 生成调查项目清单</button>')}else{openModal('确认调查项目','<div class="wizard-progress"><div class="wizard-step">1　填写调查场景</div><div class="wizard-step active">2　确认调查项目</div></div><div class="ai-plan">AI 已根据业务背景、调查目标和期望项目生成候选清单。最终范围以你的选择为准。</div><div id="project-picker" class="picker">'+wizard.projects.map(pickerRow).join('')+'</div><div class="add-project"><input id="custom-name" class="input" placeholder="添加其他调查项目"><select id="custom-category" class="select"><option value="supplier">供应商材料</option><option value="public">权威公开源</option><option value="web">开放网络</option></select><button class="btn" onclick="addCustomProject()">添加</button></div>','<button class="btn" onclick="backWizard()">上一步</button><button id="create-confirm" class="btn primary" onclick="createTask()">创建任务</button>')}}
function readFirstStep(){wizard.form.name=document.getElementById('w-name').value.trim();wizard.form.region=document.getElementById('w-region').value.trim();wizard.form.background=document.getElementById('w-background').value.trim();wizard.form.goal=document.getElementById('w-goal').value.trim();wizard.form.expected=document.getElementById('w-expected').value.trim()}
function generatePlan(){readFirstStep();if(!wizard.form.name||!wizard.form.background||!wizard.form.goal){showToast('请填写供应商名称、业务背景和调查目标');return}var b=[makeProject('entity','主体登记核验','public','核验企业主体、登记状态和关键登记信息',true),makeProject('qualification','资质与许可核验','supplier','核验本次合作所需资质及有效期',true),makeProject('screening','关键人员司法与失信筛查','public','核验关键人员是否存在司法或失信风险',true),makeProject('sentiment','负面舆情检索','web','检索与业务相关的公开新闻及网络信息',true)];wizard.form.expected.split(/[，,、\n；;]/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(n,i){if(b.some(function(p){return p.name.indexOf(n)>=0||n.indexOf(p.name)>=0}))return;var c=/舆情|新闻|媒体|投诉/.test(n)?'web':/资质|许可|证书|材料|报告/.test(n)?'supplier':'public';b.push(makeProject('custom-'+i,n,c,'来自业务期望，由业务确认调查范围',true))});wizard.projects=b;wizard.step=2;renderWizard()}
function makeProject(id,name,category,reason,selected){return{id:id,name:name,category:category,reason:reason,selected:selected,status:'pending',conclusion:'',sources:[]}}
function pickerRow(p,i){return'<label class="pick-row"><input type="checkbox" '+(p.selected?'checked':'')+' onchange="toggleProject('+i+',this.checked)"><div><strong>'+esc(p.name)+'</strong></div>'+categoryBadge(p.category)+'<div class="micro">'+esc(p.reason)+'</div></label>'}
function toggleProject(i,c){wizard.projects[i].selected=c}
function addCustomProject(){var n=document.getElementById('custom-name').value.trim(),c=document.getElementById('custom-category').value;if(!n){showToast('请输入调查项目名称');return}wizard.projects.push(makeProject('custom-'+Date.now(),n,c,'由业务人员补充',true));renderWizard()}
function backWizard(){wizard.step=1;renderWizard()}
function createTask(){var p=wizard.projects.filter(function(x){return x.selected});if(!p.length){showToast('请至少选择一个调查项目');return}p.forEach(function(x){x.status=x.category==='supplier'?'materialMissing':'sourceReady'});var need=p.some(function(x){return x.category==='supplier'}),task={id:'DD-'+String(Date.now()).slice(-8),name:wizard.form.name,region:wizard.form.region||'未填写',background:wizard.form.background,goal:wizard.form.goal,projects:p,stage:need?'missing':'ready',materialRequested:false,materialReceived:false,riskDecision:null,decision:null,approvalNote:'',updated:'刚刚',activity:[{text:'创建调查任务并确认 '+p.length+' 项调查范围',meta:'林妍 · 刚刚'}]};state.tasks.push(task);state.task=task;state.selectedTaskId=task.id;state.view='task';state.role='investigator';save();closeModal();render();showToast('调查任务已创建')}

function stageIndex(){var s=state.task.stage;if(s==='missing'||s==='ready')return 0;if(s==='running'||s==='review')return 1;if(s==='approvalReady'||s==='pendingApproval')return 2;return 3}
function stepper(){var c=stageIndex();return'<div class="stepper">'+['准备资料','执行调查','复核审批','完成'].map(function(x,i){return'<div class="step '+(i===c?'active':i<c?'done':'')+'">'+(i+1)+'　'+x+'</div>'}).join('')+'</div>'}
function renderCase(){var t=state.task,s=taskStatus(),waiting=t.stage==='pendingApproval'?'<div class="task-card"><h3>等待审批</h3><p>调查报告已提交给审批人。</p></div>':'';document.getElementById('app').innerHTML='<section class="page"><div class="case-head"><div><button class="back" onclick="goHome()">← 返回任务</button><h1>'+esc(t.name)+'</h1><div class="micro">'+esc(t.id)+' · '+esc(t.region)+'</div></div><div class="actions"><span class="badge '+s.cls+'">'+s.label+'</span></div></div>'+stepper()+'<div class="case-grid"><div><section class="panel"><div class="section-head"><h2>调查项目</h2><span class="micro">'+t.projects.length+' 项</span></div><div class="content"><div class="project-list">'+t.projects.map(projectCard).join('')+'</div></div></section><section class="panel" style="margin-top:16px"><div class="section-head"><h3>调查场景</h3></div><div class="content"><div class="summary-grid"><div class="data"><span>业务背景</span><strong>'+esc(t.background)+'</strong></div><div class="data"><span>调查目标</span><strong>'+esc(t.goal)+'</strong></div></div></div></section></div><aside class="panel"><div class="section-head"><h3>当前待办</h3></div><div class="content">'+(waiting||currentAction())+'</div><div class="section-head"><h3>操作记录</h3></div><div class="content">'+t.activity.slice(0,6).map(function(a){return'<div class="activity-item">'+esc(a.text)+'<div class="micro">'+esc(a.meta)+'</div></div>'}).join('')+'</div></aside></div></section>'}
function projectCard(p){var status=p.status;if((state.task.stage==='missing'||state.task.stage==='ready')&&status==='pending')status=p.category==='supplier'?(state.task.materialReceived?'materialReady':'materialMissing'):'sourceReady';var map={materialMissing:{tone:'amber',label:'暂无可用材料，待补充'},materialReady:{tone:'green',label:'材料可用'},sourceReady:{tone:'blue',label:'公开来源可用'},risk:{tone:'red',label:'存在风险'},noRisk:{tone:'green',label:'无风险'},running:{tone:'blue',label:'调查中'},pending:{tone:'gray',label:'待调查'}},view=map[status]||map.pending,canReview=(state.task.stage==='review'||state.task.stage==='approvalReady')&&state.role==='investigator',buttons='<div class="project-actions">'+(p.sources.length?'<button class="btn small" onclick="openEvidence(\''+esc(p.id)+'\')">查看依据</button>':'')+(canReview?'<button class="btn small review-project" onclick="openProjectReview(\''+esc(p.id)+'\')">'+(p.reviewed?'重新复核':'复核处理')+'</button>':'')+'</div>';return'<div class="project"><div><div class="project-title">'+esc(p.name)+' '+categoryBadge(p.category)+'</div><div class="project-meta">'+(p.conclusion?esc(p.conclusion):esc(p.reason))+'</div></div><span class="badge '+view.tone+'">'+view.label+'</span>'+buttons+'</div>'}
function currentAction(){var t=state.task;if(t.stage==='missing'){var missing=t.projects.filter(function(p){return p.category==='supplier'&&p.status!=='materialReady'}).map(function(p){return p.name}).join('、');return'<div class="task-card"><h3>补齐供应商材料</h3><p>待补充：'+esc(missing)+'</p><div class="actions">'+(!t.materialRequested?'<button id="request-material" class="btn primary" onclick="requestMaterial()">发起补料</button>':'<button id="receive-material" class="btn primary" onclick="receiveMaterial()">模拟收到材料</button>')+'</div></div>'}if(t.stage==='ready')return'<div class="task-card"><h3>开始调查</h3><p>调查范围已确认，可以执行所选项目。</p><div class="actions"><button id="start-investigation" class="btn primary" onclick="startInvestigation()">开始调查</button></div></div>';if(t.stage==='running')return'<div class="task-card"><h3>正在调查</h3><p>正在查询来源并生成逐项结论。</p></div>';if(t.stage==='review'||t.stage==='approvalReady')return'<div class="task-card"><h3>提交审批</h3><p>系统已生成逐项风险判断，可直接提交，也可按需复核调整。</p><div class="actions"><button id="submit-approval" class="btn primary" onclick="submitApproval()">提交审批</button></div></div>';return'<div class="task-card"><h3>等待审批</h3><p>调查报告已提交给审批人。</p></div>'}
function requestMaterial(){state.task.materialRequested=true;addActivity('向供应商发起所需材料补充请求','林妍');save();render();showToast('补料请求已发出')}
function receiveMaterial(){state.task.materialReceived=true;state.task.stage='ready';state.task.projects.filter(function(p){return p.category==='supplier'}).forEach(function(p){p.status='materialReady';p.sources=[{name:'供应商上传材料',meta:'上传时间：刚刚 · 文件版本：v1',raw:'文件：'+p.name+'相关材料.pdf\n上传方：供应商联系人\n接收时间：刚刚\n用途：用于本次供应商调查'}]});addActivity('收到并登记供应商补充材料','供应商联系人');save();render();showToast('材料已收到')}
function startInvestigation(){state.task.stage='running';state.task.projects.forEach(function(p){p.status='running'});addActivity('开始执行调查项目','林妍');save();render();setTimeout(finishInvestigation,700)}
function finishInvestigation(){if(!state.task||state.task.stage!=='running')return;state.task.projects.forEach(function(p){p.reviewed=false;if(p.id==='screening'){p.status='risk';p.systemStatus='risk';p.conclusion='系统判断：发现 1 条同名疑似记录，存在风险';p.sources=[{name:'全国法院失信被执行人公开查询',meta:'查询时间：刚刚 · 查询条件：姓名、地区',raw:'查询对象：供应商关键人员 张伟\n返回结果：1 条同名疑似\n地区：广东深圳\n身份标识：公开记录不完整\n系统判断：存在风险，可提交审批或人工复核'}]}else if(p.category==='supplier'){p.status='noRisk';p.systemStatus='noRisk';p.conclusion='系统判断：材料关键信息与本次合作要求一致，无风险';if(!p.sources.length)p.sources=[{name:'供应商上传材料',meta:'上传时间：刚刚 · 文件版本：v1',raw:'文件：'+p.name+'相关材料.pdf\n上传方：供应商联系人\n核验结果：关键信息一致'}]}else if(p.category==='web'){p.status='noRisk';p.systemStatus='noRisk';p.conclusion='系统判断：未发现与本次合作直接相关的负面信息，无风险';p.sources=[{name:'公开新闻与网络信息检索',meta:'查询时间：刚刚 · 覆盖近 3 年公开信息',raw:'检索词：'+state.task.name+' + 处罚 / 事故 / 投诉\n结果：未发现可确认且与本次合作直接相关的重大负面信息\n限制：开放网络信息可能不完整'}]}else{p.status='noRisk';p.systemStatus='noRisk';p.conclusion='系统判断：公开登记信息正常，无风险';p.sources=[{name:'国家企业信用信息公示系统',meta:'查询时间：刚刚 · 登记信息快照',raw:'企业名称：'+state.task.name+'\n登记状态：存续\n经营异常：未发现\n查询时间：刚刚'}]}p.systemConclusion=p.conclusion});state.task.stage='approvalReady';addActivity('调查完成，系统已生成 '+state.task.projects.length+' 个项目的风险判断','系统');save();render();showToast('调查完成，可直接提交或按需复核')}
var activeReviewProjectId=null;
function openProjectReview(id){activeReviewProjectId=id;var p=state.task.projects.find(function(x){return x.id===id}),selected=p.status==='risk'?'risk':'noRisk',reason=reviewReason(selected,p);openModal('复核调查项目','<div class="callout '+(p.status==='risk'?'risk':'success')+'"><strong>'+esc(p.name)+'</strong><div class="micro" style="color:inherit">'+esc(p.systemConclusion||p.conclusion)+'</div></div><div class="field" style="margin-top:15px"><label class="required">人工复核结论</label><select id="project-review-result" class="select" onchange="prefillProjectReason()"><option value="noRisk" '+(selected==='noRisk'?'selected':'')+'>无风险</option><option value="risk" '+(selected==='risk'?'selected':'')+'>存在风险</option><option value="unknown">暂无法判断</option></select></div><div class="field"><label class="required">判断依据</label><textarea id="project-review-reason" class="textarea">'+esc(reason)+'</textarea></div><button class="btn small" onclick="openEvidence(\''+esc(p.id)+'\')">查看原始依据</button>','<button class="btn" onclick="closeModal()">取消</button><button id="save-project-review" class="btn primary" onclick="saveProjectReview()">保存复核</button>')}
function reviewReason(result,p){if(result==='risk')return'复核原始记录与主体信息后，确认该项目存在需要纳入审批判断的风险。';if(result==='unknown')return'现有信息不足以确认或排除该项目风险，需要补充证据后再次复核。';return p&&p.id==='screening'?'补充身份信息显示出生年份与任职经历不一致，确认疑似记录并非同一主体。':'已复核原始依据，未发现需要纳入审批判断的确认风险。'}
function prefillProjectReason(){var p=state.task.projects.find(function(x){return x.id===activeReviewProjectId});document.getElementById('project-review-reason').value=reviewReason(document.getElementById('project-review-result').value,p)}
function saveProjectReview(){var result=document.getElementById('project-review-result').value,reason=document.getElementById('project-review-reason').value.trim(),p=state.task.projects.find(function(x){return x.id===activeReviewProjectId});if(!reason){showToast('请填写判断依据');return}p.sources=p.sources.filter(function(s){return s.name!=='人工复核记录'});if(result==='unknown'){p.reviewed=false;p.status=p.systemStatus;p.conclusion='人工复核：暂无法判断，当前保留系统风险标记';addActivity('“'+p.name+'”人工复核为暂无法判断','林妍')}else{p.reviewed=true;p.status=result;p.conclusion=result==='risk'?'人工复核：确认存在风险':'人工复核：确认无风险';p.sources.push({name:'人工复核记录',meta:'复核人：林妍 · 记录时间：刚刚',raw:'复核结论：'+(result==='risk'?'存在风险':'无风险')+'\n判断依据：'+reason});addActivity('“'+p.name+'”人工复核为'+(result==='risk'?'存在风险':'无风险'),'林妍')}state.task.stage='approvalReady';save();closeModal();render();showToast(result==='unknown'?'已记录，当前保留系统判断':'该项目复核结论已保存')}
function submitApproval(){var t=state.task,unreviewed=t.projects.filter(function(p){return !p.reviewed}).length,riskCount=t.projects.filter(function(p){return p.status==='risk'}).length,rows=t.projects.map(function(p){return'<div class="confirm-row"><div><strong>'+esc(p.name)+'</strong><div class="micro">'+(p.reviewed?'人工已复核':'沿用系统判断')+'</div></div><span class="badge '+(p.status==='risk'?'red':'green')+'">'+(p.status==='risk'?'存在风险':'无风险')+'</span></div>'}).join('');openModal('确认提交审批','<div class="callout"><strong>请确保对每个调查项目的结果均无异议后再提交。</strong><div class="micro" style="color:inherit;margin-top:5px">提交仅代表进入审批，不代表系统已确认供应商不存在风险。</div></div><div class="confirm-list">'+rows+'</div><div class="micro" style="margin-bottom:12px">共 '+t.projects.length+' 项，其中 '+riskCount+' 项标记为存在风险，'+unreviewed+' 项未人工复核。</div><label class="confirm-check"><input id="submit-confirm-check" type="checkbox" onchange="toggleSubmitConfirm()"><span>我已检查所有项目的风险标记和结论，对当前结果无异议，并确认提交审批。</span></label>','<button class="btn" onclick="closeModal()">返回检查</button><button id="confirm-submit-approval" class="btn primary" disabled onclick="confirmSubmitApproval()">确认无异议并提交</button>')}
function toggleSubmitConfirm(){document.getElementById('confirm-submit-approval').disabled=!document.getElementById('submit-confirm-check').checked}
function confirmSubmitApproval(){if(!document.getElementById('submit-confirm-check').checked){showToast('请先确认所有项目结果无异议');return}state.task.stage='pendingApproval';addActivity('确认所有项目结果无异议并提交审批','林妍');save();closeModal();render();showToast('已提交审批，请切换为审批人')}

function renderApproval(){var t=state.task,risk=t.projects.some(function(p){return p.status==='risk'}),riskCount=t.projects.filter(function(p){return p.status==='risk'}).length,reviewedCount=t.projects.filter(function(p){return p.reviewed}).length,note=risk?'要求供应商完成整改并经复核通过后准入。':'调查项目均已完成，相关结论及依据已核验，同意本次供应商准入。';document.getElementById('app').innerHTML='<section class="page"><div class="case-head"><div><button class="back" onclick="goHome()">← 返回任务</button><h1>'+esc(t.name)+'</h1><div class="micro">'+esc(t.id)+' · 调查报告</div></div><span class="badge blue">待审批</span></div>'+stepper()+'<div class="approval-layout"><section class="panel"><div class="section-head"><h2>逐项调查结论</h2><span class="micro">人工复核 '+reviewedCount+' / '+t.projects.length+' 项</span></div><div class="content"><div class="callout '+(risk?'risk':'success')+'">'+(risk?'当前结论包含 '+riskCount+' 项风险，未人工复核的项目沿用系统判断。':'当前项目均标记为无风险，未人工复核的项目沿用系统判断。')+'</div><div style="margin-top:12px">'+t.projects.map(approvalProject).join('')+'</div></div></section><aside class="panel"><div class="section-head"><h3>审批决定</h3></div><div class="content">'+decisionOptions(risk)+'<div class="field"><label id="approval-label">'+(risk?'审批意见（必填）':'审批意见（选填）')+'</label><textarea id="approval-note" class="textarea">'+esc(note)+'</textarea></div><button id="sign-approval" class="btn primary" style="width:100%" onclick="signApproval()">签字并完成</button><button class="btn" style="width:100%;margin-top:8px" onclick="returnReview()">退回复核</button></div></aside></div></section>'}
function approvalProject(p){var risk=p.status==='risk';return'<div class="source-row"><div><div class="project-title">'+esc(p.name)+' '+categoryBadge(p.category)+'</div><div class="project-meta">'+esc(p.conclusion)+'</div></div><span class="badge '+(risk?'red':'green')+'">'+(risk?'存在风险':'无风险')+'</span><button class="btn small" onclick="openEvidence(\''+esc(p.id)+'\')">查看依据</button></div>'}
function decisionOptions(risk){var a=risk?[['conditional','附条件通过'],['reject','拒绝'],['hold','暂缓']]:[['pass','通过'],['conditional','附条件通过'],['reject','拒绝']];return'<div style="margin-bottom:14px">'+a.map(function(o,i){return'<label class="radio"><input type="radio" name="decision" value="'+o[0]+'" '+(i===0?'checked':'')+' onchange="decisionChanged()"><strong>'+o[1]+'</strong></label>'}).join('')+'</div>'}
function decisionChanged(){var v=document.querySelector('input[name="decision"]:checked').value,hasRisk=state.task.projects.some(function(p){return p.status==='risk'}),req=hasRisk||v!=='pass',notes={pass:'调查项目均已完成，相关结论及依据已核验，同意本次供应商准入。',conditional:'要求供应商完成整改并经复核通过后准入。',reject:'确认风险超出本次合作可接受范围，不同意本次供应商准入。',hold:'现有风险尚需进一步核实，暂缓本次供应商准入。'};document.getElementById('approval-label').textContent=req?'审批意见（必填）':'审批意见（选填）';document.getElementById('approval-note').value=notes[v]}
function signApproval(){var d=document.querySelector('input[name="decision"]:checked').value,n=document.getElementById('approval-note').value.trim(),hasRisk=state.task.projects.some(function(p){return p.status==='risk'});if((hasRisk||d!=='pass')&&!n){showToast('请填写审批意见');return}state.task.decision=d;state.task.approvalNote=n;state.task.stage='completed';addActivity('审批人签字，调查任务完成','周明');save();render();showToast('审批已完成')}
function returnReview(){state.task.stage='approvalReady';state.role='investigator';addActivity('审批退回调查执行人补充复核','周明');save();render();showToast('已退回调查执行人')}
function renderArchive(){var t=state.task,labels={pass:'通过',conditional:'附条件通过',reject:'拒绝',hold:'暂缓'};document.getElementById('app').innerHTML='<section class="page"><div class="case-head"><div><button class="back" onclick="goHome()">← 返回任务</button><h1>'+esc(t.name)+'</h1><div class="micro">'+esc(t.id)+'</div></div><div class="actions"><span class="badge green">已完成</span></div></div>'+stepper()+'<section class="panel"><div class="section-head"><h2>最终结论：'+esc(labels[t.decision]||'已完成')+'</h2><span class="badge green">审批人已签字</span></div><div class="content">'+(t.approvalNote?'<div class="conclusion">审批意见：'+esc(t.approvalNote)+'</div>':'')+'<div style="margin-top:12px">'+t.projects.map(approvalProject).join('')+'</div></div></section></section>'}
function openEvidence(id){var p=state.task.projects.find(function(x){return x.id===id});if(!p)return;var rows=p.sources.map(function(s){return'<div class="source-row"><div><div class="name">'+esc(s.name)+'</div><div class="micro">'+esc(s.meta)+'</div></div>'+categoryBadge(p.category)+'</div><div class="raw-box">'+esc(s.raw)+'</div>'}).join('');openDrawer(p.name,'结论与原始参考信息','<div class="callout '+(p.status==='risk'?'risk':'success')+'">'+esc(p.conclusion||'尚未形成结论')+'</div><div style="margin-top:14px">'+(rows||'<div class="micro">尚无来源记录</div>')+'</div>')}
function openModal(t,b,f){document.getElementById('modal-root').innerHTML='<div class="modal-layer" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>'+esc(t)+'</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">'+b+'</div><div class="modal-foot">'+f+'</div></div></div>'}
function closeModal(){document.getElementById('modal-root').innerHTML=''}function openDrawer(t,s,b){document.getElementById('drawer-root').innerHTML='<div class="drawer-layer" onclick="if(event.target===this)closeDrawer()"><aside class="drawer"><div class="drawer-head"><div><h2>'+esc(t)+'</h2><div class="micro">'+esc(s)+'</div></div><button class="close" onclick="closeDrawer()">×</button></div><div class="drawer-body">'+b+'</div></aside></div>'}function closeDrawer(){document.getElementById('drawer-root').innerHTML=''}
render();
</script>
</body>
</html>
